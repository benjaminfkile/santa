<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://maps.googleapis.com https://www.googletagmanager.com;
      connect-src 'self' %VITE_CDN_BASE_URL% %VITE_API_BASE_URL% %VITE_HUB_URL% %VITE_COGNITO_AUTHORITY%/ %VITE_COGNITO_DOMAIN%
                  https://maps.googleapis.com https://www.googletagmanager.com https://*.google-analytics.com;
      img-src 'self' data: blob: %VITE_CDN_BASE_URL% https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.gstatic.com https://*.ggpht.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      worker-src 'self' blob:;
      frame-src 'none'; object-src 'none'; base-uri 'self';
    ">
    <link rel="preconnect" href="%VITE_CDN_BASE_URL%" crossorigin />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Western Montana Santa Flyover</title>
    <script>
      (function () {
        try {
          var stored = null;
          try { stored = window.localStorage.getItem("wmsfo.theme"); } catch (e) { stored = null; }
          var t;
          if (stored === "light" || stored === "dark") {
            t = stored;
          } else {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (err) {
          // Stamp nothing: no data-theme attribute means system (the CSS
          // fallback), never forced dark.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
