# docs/site.md section 21.3.
name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: contracts:check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run contracts:check
      - name: contracts:types (regenerate and fail on diff)
        run: |
          npm run contracts:types
          if ! git diff --quiet -- src/contracts/generated; then
            echo "Generated contract types are stale. Run 'npm run contracts:types' locally and commit."
            git --no-pager diff -- src/contracts/generated
            exit 1
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run size
